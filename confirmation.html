
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation - QuickBite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Order Confirmation</h1>

    <section id="confirmation">
        <h2 id="thank-you"></h2>
        <p id="order-number"></p>

        <div id="order-items"></div>
        <p id="total"></p>

        <a href="index.html">Back to Menu</a>
    </section>

    <script>
        const name = localStorage.getItem("name") || "Customer";
        const orderNumber = localStorage.getItem("quickbiteOrderNumber");
        const cart = JSON.parse(localStorage.getItem("quickbiteCart")) || [];
        const total = localStorage.getItem("quickbiteTotal") || "0.00";

        document.getElementById("thank-you").textContent =
            "Thank you, " + name + "!";

        document.getElementById("order-number").textContent =
            "Your order number is: " + orderNumber;

        const orderItems = document.getElementById("order-items");

        for (const item of cart) {
            const p = document.createElement("p");

            p.textContent = item.name + " x " + item.quantity +
                " - €" + (item.price * item.quantity).toFixed(2);

            orderItems.appendChild(p);
        }

        document.getElementById("total").textContent =
            "Total: €" + total;
    </script>

</body>
</html>
