
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickBite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>QuickBite</h1>
  <p class="tagline">Order your food, skip the queue</p>

  <nav>
    <a href="index.html">Menu</a> |
    <a href="cart.html">View Cart (<span id="cart-count">0</span>)</a>
  </nav>

  <section id="menu">
    <h2>Menu</h2>
    <ul id="menu-list"></ul>
  </section>

  <p id="message"></p>

  <script>
    // SCRUM-7 Browse the menu
    const MENU_ITEMS = [
      { id: 1, name: "Chicken wrap", price: 5.5 },
      { id: 2, name: "Veggie burger", price: 6.5 },
      { id: 3, name: "Pizza slice", price: 3.5 },
      { id: 4, name: "Chips", price: 2.5 },
      { id: 5, name: "Coffee", price: 2.2 }
    ];

    let cart = JSON.parse(localStorage.getItem("quickbiteCart")) || [];

    const list = document.getElementById("menu-list");

    function updateCartCount() {
      let count = 0;

      for (const item of cart) {
        count += item.quantity;
      }

      document.getElementById("cart-count").textContent = count;
    }

    function addToCart(item) {
      const existing = cart.find(function (cartItem) {
        return cartItem.id === item.id;
      });

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: item.id,
          name: item.name,
          price: item.price,
          quantity: 1
        });
      }

      localStorage.setItem("quickbiteCart", JSON.stringify(cart));
      updateCartCount();

      document.getElementById("message").textContent =
        item.name + " added to cart!";
    }

    MENU_ITEMS.forEach(function (item) {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.textContent = item.name;

      const price = document.createElement("span");
      price.className = "price";
      price.textContent = "€" + item.price.toFixed(2);

      const btn = document.createElement("button");
      btn.textContent = "Add";
      btn.onclick = function () {
        addToCart(item);
      };

      li.append(name, price, btn);
      list.appendChild(li);
    });

    updateCartCount();
  </script>
</body>
</html>
