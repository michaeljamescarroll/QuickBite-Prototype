<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite – Add to Cart</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f6f6f6; color: #222; }
  header { background: #e85d04; color: white; padding: 16px 24px; font-size: 22px; font-weight: bold; }
  main { display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; }
  section { background: white; border-radius: 8px; padding: 16px; flex: 1; min-width: 280px; }
  h2 { margin-top: 0; }
  .item { display: flex; justify-content: space-between; align-items: center;
          padding: 10px 0; border-bottom: 1px solid #eee; }
  .item:last-child { border-bottom: none; }
  .price { color: #666; font-size: 14px; }
  button { background: #e85d04; color: white; border: none; border-radius: 6px;
           padding: 8px 14px; cursor: pointer; font-size: 14px; }
  button:hover { background: #c94f02; }
  .qty-btn { padding: 2px 10px; }
  .total { font-size: 18px; font-weight: bold; margin-top: 12px; text-align: right; }
  .empty { color: #999; font-style: italic; }
</style>
</head>
<body>

<header>QuickBite ☕</header>

<main>
  <!-- MENU (teammate's "View the menu" story can replace this part) -->
  <section>
    <h2>Menu</h2>
    <div id="menu"></div>
  </section>

  <!-- CART (my story: SCRUM-8 Add items to the cart) -->
  <section>
    <h2>Your Cart</h2>
    <div id="cart"></div>
    <div class="total">Total: €<span id="total">0.00</span></div>
  </section>
</main>

<script>
  // 1. The menu data – a simple list of items with a name and price
  const menu = [
    { id: 1, name: "Americano",       price: 2.80 },
    { id: 2, name: "Latte",           price: 3.50 },
    { id: 3, name: "Chicken Wrap",    price: 5.95 },
    { id: 4, name: "Blueberry Muffin", price: 2.50 },
    { id: 5, name: "Bottle of Water", price: 1.20 }
  ];

  // 2. The cart – starts empty. Each entry is { id, name, price, quantity }
  let cart = [];

  // 3. Show the menu with an "Add" button for each item
  function showMenu() {
    let html = "";
    for (const item of menu) {
      html += `
        <div class="item">
          <div>${item.name}<br><span class="price">€${item.price.toFixed(2)}</span></div>
          <button onclick="addToCart(${item.id})">Add</button>
        </div>`;
    }
    document.getElementById("menu").innerHTML = html;
  }

  // 4. ADD TO CART – the main feature.
  //    If the item is already in the cart, increase the quantity.
  //    If not, add it with quantity 1.
  function addToCart(id) {
    const existing = cart.find(c => c.id === id);
    if (existing) {
      existing.quantity += 1;
    } else {
      const item = menu.find(m => m.id === id);
      cart.push({ id: item.id, name: item.name, price: item.price, quantity: 1 });
    }
    showCart();
  }

  // 5. Remove one of an item (used by the "−" button)
  function removeOne(id) {
    const existing = cart.find(c => c.id === id);
    existing.quantity -= 1;
    if (existing.quantity === 0) {
      cart = cart.filter(c => c.id !== id);
    }
    showCart();
  }

  // 6. Show the cart and update the total
  function showCart() {
    if (cart.length === 0) {
      document.getElementById("cart").innerHTML = '<p class="empty">Your cart is empty.</p>';
    } else {
      let html = "";
      for (const c of cart) {
        html += `
          <div class="item">
            <div>${c.name}<br><span class="price">€${(c.price * c.quantity).toFixed(2)}</span></div>
            <div>
              <button class="qty-btn" onclick="removeOne(${c.id})">−</button>
              <strong> ${c.quantity} </strong>
              <button class="qty-btn" onclick="addToCart(${c.id})">+</button>
            </div>
          </div>`;
      }
      document.getElementById("cart").innerHTML = html;
    }

    // Total = price × quantity for every item, added up
    let total = 0;
    for (const c of cart) {
      total += c.price * c.quantity;
    }
    document.getElementById("total").textContent = total.toFixed(2);
  }

  // Run when the page loads
  showMenu();
  showCart();
</script>

</body>
</html>
