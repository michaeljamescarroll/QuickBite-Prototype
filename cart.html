<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite – Add to Cart</title>
<link rel="stylesheet" href="style.css">

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f6f6f6;
    color: #222;
  }

  header {
    background: #e85d04;
    color: white;
    padding: 16px 24px;
    font-size: 22px;
    font-weight: bold;
  }

  main {
    display: flex;
    gap: 24px;
    padding: 24px;
    flex-wrap: wrap;
  }

  section {
    background: white;
    border-radius: 8px;
    padding: 16px;
    flex: 1;
    min-width: 280px;
  }

  h2 {
    margin-top: 0;
  }

  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }

  .item:last-child {
    border-bottom: none;
  }

  .price {
    color: #666;
    font-size: 14px;
  }

  button {
    background: #e85d04;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
  }

  button:hover {
    background: #c94f02;
  }

  .qty-btn {
    padding: 2px 10px;
  }

  .total {
    font-size: 18px;
    font-weight: bold;
    margin-top: 12px;
    text-align: right;
  }

  .empty {
    color: #999;
    font-style: italic;
  }

  nav {
    padding: 12px 24px;
    background: white;
  }

  nav a {
    color: #e85d04;
    margin-right: 15px;
    text-decoration: none;
    font-weight: bold;
  }

  #checkout-button {
    display: block;
    margin: 20px 0 0 auto;
  }
</style>
</head>
<body>

<header>QuickBite ☕</header>

<nav>
  <a href="index.html">Menu</a>
  <a href="cart.html">Your Cart</a>
</nav>

<main>

  <!-- MENU -->
  <section>
    <h2>Menu</h2>
    <div id="menu"></div>
  </section>

  <!-- CART -->
  <section>
    <h2>Your Cart</h2>
    <div id="cart"></div>
    <div class="total">Total: €<span id="total">0.00</span></div>
    <button id="checkout-button" onclick="goToCheckout()">Checkout</button>
  </section>

</main>

<script>
  // Menu items shared with index.html
  const menu = [
    { id: 1, name: "Chicken wrap", price: 5.5 },
    { id: 2, name: "Veggie burger", price: 6.5 },
    { id: 3, name: "Pizza slice", price: 3.5 },
    { id: 4, name: "Chips", price: 2.5 },
    { id: 5, name: "Coffee", price: 2.2 }
  ];

  // Load cart saved from index.html
  let cart = JSON.parse(localStorage.getItem("quickbiteCart")) || [];

  // Show menu with Add buttons
  function showMenu() {
    let html = "";

    for (const item of menu) {
      html += `
        <div class="item">
          <div>${item.name}<br>
          <span class="price">€${item.price.toFixed(2)}</span></div>
          <button onclick="addToCart(${item.id})">Add</button>
        </div>`;
    }

    document.getElementById("menu").innerHTML = html;
  }

  // Add item or increase quantity
  function addToCart(id) {
    const existing = cart.find(c => c.id === id);

    if (existing) {
      existing.quantity += 1;
    } else {
      const item = menu.find(m => m.id === id);

      cart.push({
        id: item.id,
        name: item.name,
        price: item.price,
        quantity: 1
      });
    }

    saveCart();
    showCart();
  }

  // Remove one item
  function removeOne(id) {
    const existing = cart.find(c => c.id === id);

    if (existing) {
      existing.quantity -= 1;

      if (existing.quantity <= 0) {
        cart = cart.filter(c => c.id !== id);
      }
    }

    saveCart();
    showCart();
  }

  // Save cart for other pages
  function saveCart() {
    localStorage.setItem("quickbiteCart", JSON.stringify(cart));
  }

  // Display cart and total
  function showCart() {
    if (cart.length === 0) {
      document.getElementById("cart").innerHTML =
        '<p class="empty">Your cart is empty.</p>';
    } else {
      let html = "";

      for (const c of cart) {
        html += `
          <div class="item">
            <div>${c.name}<br>
            <span class="price">€${(c.price * c.quantity).toFixed(2)}</span></div>
            <div>
              <button class="qty-btn" onclick="removeOne(${c.id})">−</button>
              <strong> ${c.quantity} </strong>
              <button class="qty-btn" onclick="addToCart(${c.id})">+</button>
            </div>
          </div>`;
      }

      document.getElementById("cart").innerHTML = html;
    }

    let total = 0;

    for (const c of cart) {
      total += c.price * c.quantity;
    }

    document.getElementById("total").textContent = total.toFixed(2);
  }

  // Continue to checkout
  function goToCheckout() {
    if (cart.length === 0) {
      alert("Your cart is empty. Please add items before checking out.");
    } else {
      window.location.href = "checkout.html";
    }
  }

  // Run when page loads
  showMenu();
  showCart();
</script>

</body>
</html>
