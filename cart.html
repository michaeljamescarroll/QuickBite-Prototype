
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuickBite Cart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        header {
            background: #e67e22;
            color: white;
            padding: 15px;
            margin: -30px -16px 20px;
        }

        header h1 {
            color: white;
        }

        nav {
            margin: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        section {
            background: #fff3d6;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
        }

        .menu-item, .cart-item {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .cart-item button {
            margin: 3px;
        }

        #cart-total {
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>QuickBite ☕</h1>
        <nav>
            <a href="index.html">Menu</a>
            <a href="cart.html">Cart</a>
            <a href="checkout.html">Checkout</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Menu</h2>
            <div id="menu"></div>
        </section>

        <section>
            <h2>Your Cart</h2>
            <div id="cart"></div>
            <p id="cart-total">Total: €0.00</p>
            <button onclick="goToCheckout()">Checkout</button>
        </section>
    </main>

    <script>
        const menu = [
            { id: 1, name: "Chicken wrap", price: 5.5 },
            { id: 2, name: "Veggie burger", price: 6.5 },
            { id: 3, name: "Pizza slice", price: 3.5 },
            { id: 4, name: "Chips", price: 2.5 },
            { id: 5, name: "Coffee", price: 2.2 }
        ];

        let cart = JSON.parse(localStorage.getItem("quickbiteCart")) || [];

        function saveCart() {
            localStorage.setItem("quickbiteCart", JSON.stringify(cart));
        }

        function showMenu() {
            const menuDiv = document.getElementById("menu");
            menuDiv.innerHTML = "";

            menu.forEach(function(item) {
                const div = document.createElement("div");
                div.className = "menu-item";

                div.innerHTML = item.name + " - €" + item.price.toFixed(2);

                const button = document.createElement("button");
                button.textContent = "Add";
                button.onclick = function() {
                    addToCart(item.id);
                };

                div.appendChild(button);
                menuDiv.appendChild(div);
            });
        }

        function addToCart(id) {
            const item = menu.find(function(item) {
                return item.id === id;
            });

            const existing = cart.find(function(cartItem) {
                return cartItem.id === id;
            });

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    quantity: 1
                });
            }

            saveCart();
            showCart();
        }

        function removeOne(id) {
            const item = cart.find(function(cartItem) {
                return cartItem.id === id;
            });

            if (item) {
                item.quantity -= 1;

                if (item.quantity <= 0) {
                    cart = cart.filter(function(cartItem) {
                        return cartItem.id !== id;
                    });
                }
            }

            saveCart();
            showCart();
        }

        function showCart() {
            const cartDiv = document.getElementById("cart");
            cartDiv.innerHTML = "";

            let total = 0;

            cart.forEach(function(item) {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const div = document.createElement("div");
                div.className = "cart-item";

                div.textContent = item.name + " x " + item.quantity +
                    " - €" + itemTotal.toFixed(2);

                const addButton = document.createElement("button");
                addButton.textContent = "+";
                addButton.onclick = function() {
                    addToCart(item.id);
                };

                const removeButton = document.createElement("button");
                removeButton.textContent = "-";
                removeButton.onclick = function() {
                    removeOne(item.id);
                };

                div.appendChild(addButton);
                div.appendChild(removeButton);
                cartDiv.appendChild(div);
            });

            document.getElementById("cart-total").textContent =
                "Total: €" + total.toFixed(2);
        }

        function goToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
            } else {
                window.location.href = "checkout.html";
            }
        }

        showMenu();
        showCart();
    </script>

</body>
</html>
