
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - QuickBite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Checkout</h1>

    <section id="checkout">
        <h2>Your Order</h2>
        <div id="order-items"></div>
        <p id="total"></p>

        <h2>Customer Details</h2>
        <form id="checkout-form">
            <label for="name">Student Name:</label>
            <input type="text" id="name" required>

            <button type="submit">Place Order</button>
        </form>
    </section>

    <script>
        let cart = JSON.parse(localStorage.getItem("quickbiteCart")) || [];

        const orderItems = document.getElementById("order-items");
        const totalElement = document.getElementById("total");

        let total = 0;

        function showOrder() {
            orderItems.innerHTML = "";
            total = 0;

            for (const item of cart) {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const p = document.createElement("p");
                p.textContent = item.name + " x " + item.quantity +
                    " - €" + itemTotal.toFixed(2);

                orderItems.appendChild(p);
            }

            totalElement.textContent = "Total: €" + total.toFixed(2);
        }

        document.getElementById("checkout-form").addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;

            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            localStorage.setItem("name", name);
            localStorage.setItem("quickbiteTotal", total.toFixed(2));

            const orderNumber = Math.floor(Math.random() * 90000) + 10000;
            localStorage.setItem("quickbiteOrderNumber", orderNumber);

            window.location.href = "confirmation.html";
        });

        showOrder();
    </script>

</body>
</html>
